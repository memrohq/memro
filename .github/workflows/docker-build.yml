name: Docker Build Check

on:
  pull_request:
    paths:
      - 'server/**'
      - 'apps/dashboard/**'
      - '**/Dockerfile'
      - 'docker-compose*.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'apps/dashboard/**'
      - '**/Dockerfile'
      - 'docker-compose*.yml'

permissions:
  contents: read

jobs:
  build-server:
    name: Build Server Image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          platforms: linux/amd64

  build-dashboard:
    name: Build Dashboard Image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: apps/dashboard
          push: false
          platforms: linux/amd64
