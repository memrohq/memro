name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memro
          POSTGRES_PASSWORD: memro
          POSTGRES_DB: memro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -race -v ./... 2>&1 | tee test.log; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
        env:
          MEMRO_TEST_DATABASE_URL: postgres://memro:memro@localhost:5432/memro
          MEMRO_REQUIRE_DB_TESTS: "1"
      - name: Ensure no integration test was skipped
        run: "! grep -- '--- SKIP' test.log"
      - name: Build Docker image
        run: docker build -t memro:ci .

  sdk-go:
    name: SDK (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - run: go vet ./...
      - run: go test ./...

  sdk-python:
    name: SDK (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "sdk/python[dev]"
      - run: pytest -q sdk/python/tests

  sdk-js:
    name: SDK (JavaScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  # Every SDK and the MCP server against a real API with legacy signatures
  # disabled, so they must use v2 signing or API keys.
  end-to-end:
    name: SDKs and MCP end to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memro
          POSTGRES_PASSWORD: memro
          POSTGRES_DB: memro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEMRO_TEST_BASE_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start the API
        working-directory: server
        run: |
          go build -o /tmp/memro-api ./cmd/memro-api
          DATABASE_URL=postgres://memro:memro@localhost:5432/memro ALLOW_LEGACY_SIGNATURES=false \
            RATE_LIMIT_MAX=5000 FILE_STORAGE_PATH=/tmp/memro-files /tmp/memro-api > /tmp/api.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8081/health && exit 0; sleep 1; done
          cat /tmp/api.log; exit 1
      - run: pip install -e "sdk/python[dev]" -e mcp pytest httpx
      - name: Python SDK
        run: pytest -q sdk/python/tests
      - name: MCP server (every tool)
        run: pytest -q mcp/tests
      - name: JavaScript SDK
        working-directory: sdk/js
        run: npm ci && npm test
      - name: Go SDK
        working-directory: sdk/go
        run: go test -race ./...
      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e sdk/python -e mcp pytest httpx
      - run: python -m compileall -q mcp/src
      - run: pytest -q mcp/tests
      - name: Build Docker image
        run: docker build -f mcp/Dockerfile -t memro-mcp:ci .

  cli:
    name: CLI (npx memro-cli)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
        working-directory: cli
      - run: node bin/memro.js --help
        working-directory: cli

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci && npm run build
        working-directory: apps/dashboard
      - name: Build Docker image
        run: docker build -t memro-dashboard:ci apps/dashboard
