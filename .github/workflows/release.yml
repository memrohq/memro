name: Release

# Publishing a version tag (v1.2.3) builds the server and dashboard images, pushes
# them to GHCR and signs them with Sigstore (keyless). Images are only built from tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  server-image:
    name: Build & Publish Server Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/memro
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Memro
            org.opencontainers.image.description=Verified memory infrastructure for AI agents
            org.opencontainers.image.source=https://github.com/memrohq/memro
            org.opencontainers.image.licenses=LicenseRef-PolyForm-Noncommercial-1.0.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/memro@${{ steps.build.outputs.digest }}

  dashboard-image:
    name: Build & Publish Dashboard Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/memro-dashboard
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Memro Dashboard
            org.opencontainers.image.description=Web dashboard for Memro agent memory
            org.opencontainers.image.source=https://github.com/memrohq/memro
            org.opencontainers.image.licenses=LicenseRef-PolyForm-Noncommercial-1.0.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/dashboard
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/memro-dashboard@${{ steps.build.outputs.digest }}

  # Tag server/vX.Y.Z as well so the Go module version matches the release.
  go-module-tag:
    name: Tag Go Module Version
    runs-on: ubuntu-latest
    needs: [server-image, dashboard-image]
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag "server/${GITHUB_REF_NAME}"
          git push origin "server/${GITHUB_REF_NAME}"

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [server-image, dashboard-image]
    steps:
      - uses: actions/checkout@v4
      - name: Create or verify release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          else
            echo "Release $GITHUB_REF_NAME already exists, leaving existing release intact."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
