name: Release

# Pushing a version tag (vX.Y.Z, made by scripts/release.sh) releases Memro:
#   1. verify   - the tag is on main, only its last number went up from the
#                 previous release, and CHANGELOG.md has its section
#   2. images   - server and dashboard images to GHCR, signed with Sigstore
#   3. release  - a GitHub release whose notes are that CHANGELOG section
#   4. go tags  - server/vX.Y.Z and sdk/go/vX.Y.Z, so `go get ...@vX.Y.Z` works
#   5. packages - PyPI (memro, memro-mcp) and npm (@memro/sdk, memro-cli). Each
#      package keeps its own version: one already on the registry is skipped, and
#      a registry without its token secret is skipped with a warning.
# See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is vX.Y.Z on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.3"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Only the last number changed from the previous release
        run: scripts/check_release_version.sh "$GITHUB_REF_NAME"
      - name: CHANGELOG.md has a section for the tag
        run: scripts/changelog_section.sh "$GITHUB_REF_NAME"

  server-image:
    name: Build & Publish Server Image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/memro
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Memro
            org.opencontainers.image.description=Verified memory infrastructure for AI agents
            org.opencontainers.image.source=https://github.com/memrohq/memro
            org.opencontainers.image.licenses=LicenseRef-PolyForm-Noncommercial-1.0.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/memro@${{ steps.build.outputs.digest }}

  dashboard-image:
    name: Build & Publish Dashboard Image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/memro-dashboard
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Memro Dashboard
            org.opencontainers.image.description=Web dashboard for Memro agent memory
            org.opencontainers.image.source=https://github.com/memrohq/memro
            org.opencontainers.image.licenses=LicenseRef-PolyForm-Noncommercial-1.0.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/dashboard
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/memro-dashboard@${{ steps.build.outputs.digest }}

  github-release:
    name: GitHub Release
    needs: [server-image, dashboard-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/changelog_section.sh "$GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<EOF

          ### Install
          - Docker: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/memro:${GITHUB_REF_NAME#v}\` and \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/memro-dashboard:${GITHUB_REF_NAME#v}\` (signed with Sigstore)
          - Go: \`go get github.com/memrohq/memro/sdk/go@${GITHUB_REF_NAME}\`
          - Connect your AI tools: \`npx memro-cli connect\`
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; updating its notes."
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "Memro $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

  # Go modules in subdirectories need their own prefixed tags.
  go-module-tags:
    name: Tag Go modules
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push server/ and sdk/go/ tags
        run: |
          for prefix in server sdk/go; do
            tag="$prefix/$GITHUB_REF_NAME"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
            else
              git tag "$tag" "$GITHUB_SHA" && git push origin "refs/tags/$tag"
            fi
          done

  publish-pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and publish memro and memro-mcp
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then echo "::warning::PYPI_API_TOKEN is not set; skipping PyPI"; exit 0; fi
          pip install --quiet build twine
          for dir in sdk/python mcp; do
            read -r name version < <(python -c "import tomllib; p=tomllib.load(open('$dir/pyproject.toml','rb'))['project']; print(p['name'], p['version'])")
            if curl -sf "https://pypi.org/pypi/$name/$version/json" >/dev/null; then
              echo "$name $version is already on PyPI; skipping"; continue
            fi
            (cd "$dir" && python -m build && twine check dist/*)
            TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_API_TOKEN" twine upload "$dir"/dist/*
          done

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Publish @memro/sdk and memro-cli
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::NPM_TOKEN is not set; skipping npm"; exit 0; fi
          for dir in sdk/js cli; do
            name=$(node -p "require('./$dir/package.json').name"); version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name $version is already on npm; skipping"; continue
            fi
            (cd "$dir" && { [ ! -f package-lock.json ] || npm ci; } && npm test && npm publish --access public)
          done
