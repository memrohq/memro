[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memro-mcp"
version = "0.2.1"
description = "Memro — verified memory infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LicenseRef-PolyForm-Noncommercial-1.0.0"}
authors = [
    {name = "memro Team", email = "sdk@memro.co"}
]
keywords = ["ai-agents", "agent-memory", "mcp", "llm"]

dependencies = [
    "mcp>=1.9,<2",
    "memro>=0.2,<0.3",
    "python-dotenv>=1,<2",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
    # uvloop does not build on Windows; the server falls back to asyncio.
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.scripts]
memro-mcp = "memro_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://memro.co"
Repository = "https://github.com/memrohq/memro"
