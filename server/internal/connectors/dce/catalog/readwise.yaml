apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: readwise
  version: "1"
  displayName: Readwise
  category: knowledge
  description: Your books and articles with every highlight and note.
  docsURL: https://readwise.io/access_token
spec:
  type: rest
  baseURL: https://readwise.io/api/v2
  fields:
    - {name: token, label: Access token, secret: true, help: "readwise.io/access_token."}
  auth: {type: apiKey, secretRef: token, header: Authorization, prefix: "Token "}
  verify: {path: /auth/}
  operations:
    - name: export
      method: GET
      path: /export/
      pagination: {type: cursor, cursorParam: pageCursor, cursorPath: nextPageCursor}
      response: {itemsPath: results}
  mapping:
    id: user_book_id
    title: "{{readable_title}}"
    content: |
      {{readable_title}} by {{author}} ({{category}})
      Source: {{source_url}}
      Tags: {{book_tags[].name}}
      {{summary}}

      Highlights:
      {{#each highlights}}- {{text}}
        Note: {{note}}
      {{/each}}
    eventDate: highlights.-1.highlighted_at
    url: readwise_url
  # Full re-read: updatedAfter returns only the changed highlights, which
  # would replace a book's memory with a partial list.
  sync: {mode: full}
  policies: {timeout: 60s, maxRetries: 3}
