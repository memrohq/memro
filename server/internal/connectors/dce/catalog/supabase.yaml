apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: supabase
  version: "1"
  displayName: Supabase
  category: engineering
  description: Your Supabase projects with their region, status and database version.
  docsURL: https://supabase.com/docs/reference/api/introduction
spec:
  type: rest
  baseURL: https://api.supabase.com/v1
  fields:
    - {name: token, label: Personal access token, secret: true, help: "Account → Access Tokens."}
  auth: {type: bearer, secretRef: token}
  verify: {path: /organizations}
  operations:
    - name: projects
      method: GET
      path: /projects
      response: {itemsPath: $}
  mapping:
    id: id
    title: "Supabase project {{name}}"
    content: |
      Supabase project {{name}} ({{id}})
      Organization: {{organization_id}}
      Region: {{region}}
      Status: {{status}}
      Postgres: {{database.version}}
      Created: {{created_at}}
    eventDate: created_at
  sync: {mode: full}
  policies: {timeout: 30s, maxRetries: 3}
