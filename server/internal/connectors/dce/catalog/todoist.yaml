apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: todoist
  version: "1"
  displayName: Todoist
  category: work
  description: Your open Todoist tasks with due dates, priorities and labels.
  docsURL: https://todoist.com/help/articles/find-your-api-token-Jpzx9IIlB
spec:
  type: rest
  baseURL: https://api.todoist.com/api/v1
  fields:
    - {name: token, label: API token, secret: true, help: "Settings → Integrations → Developer → API token."}
  auth: {type: bearer, secretRef: token}
  verify: {path: /user, accountId: id, accountName: full_name}
  operations:
    - name: tasks
      method: GET
      path: /tasks
      queryParams: {limit: "200"}
      pagination: {type: cursor, cursorParam: cursor, cursorPath: next_cursor}
      response: {itemsPath: results}
  mapping:
    id: id
    title: "{{content}}"
    content: |
      Todoist task: {{content}}
      Due: {{due.string}} ({{due.date}})
      Priority: {{priority}}
      Labels: {{labels[]}}
      Project: {{project_id}}

      {{description}}
    eventDate: updated_at
  sync: {mode: full}
  policies: {timeout: 30s, maxRetries: 3}
