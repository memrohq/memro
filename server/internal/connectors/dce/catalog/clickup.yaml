apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: clickup
  version: "1"
  displayName: ClickUp
  category: work
  description: Tasks, including closed ones and subtasks, from the workspaces you choose.
  docsURL: https://developer.clickup.com/docs/authentication#personal-token
spec:
  type: rest
  baseURL: https://api.clickup.com/api/v2
  fields:
    - {name: token, label: Personal API token, secret: true, help: "Settings → Apps → API Token (starts with pk_)."}
  auth: {type: apiKey, secretRef: token, header: Authorization}
  verify: {path: /user, accountId: user.id, accountName: user.username}
  sources:
    operation:
      name: workspaces
      method: GET
      path: /team
      response: {itemsPath: teams}
    id: id
    name: name
  operations:
    - name: tasks
      method: GET
      path: /team/{{source.id}}/task
      queryParams:
        order_by: updated
        reverse: "false"
        include_closed: "true"
        subtasks: "true"
        date_updated_gt: "{{checkpoint}}"
      pagination: {type: page, pageParam: page, zeroBased: true, limit: 100}
      response: {itemsPath: tasks}
  mapping:
    id: id
    title: "{{name}}"
    content: |
      ClickUp task: {{name}}
      Status: {{status.status}}
      List: {{list.name}}
      Folder: {{folder.name}}
      Assignees: {{assignees[].username}}
      Priority: {{priority.priority}}
      Tags: {{tags[].name}}
      Due: {{due_date}}

      {{text_content}}
    eventDate: date_updated
    authorName: creator.username
    url: url
  sync: {mode: incremental, checkpoint: date_updated, newestFirst: true}
  policies: {timeout: 30s, maxRetries: 3}
