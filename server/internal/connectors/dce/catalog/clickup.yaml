apiVersion: memro.dev/v1
kind: Connector

metadata:
  name: clickup
  version: 1.0.0
  description: Sync tasks, subtasks, and descriptions from ClickUp

spec:
  type: rest
  baseURL: https://api.clickup.com/api/v2

  auth:
    type: apiKey
    header: Authorization
    secretRef: CLICKUP_API_KEY

  operations:
    - name: list_workspaces
      method: GET
      path: /team
      pagination:
        type: none
      response:
        itemsPath: teams

  mapping:
    id: $.id
    title: $.name
    content: $.name

  sync:
    mode: full

  policies:
    timeout: 15s
    maxRetries: 3
    rateLimitPerMin: 100
