apiVersion: memro.dev/v1
kind: Connector

metadata:
  name: basecamp
  version: 1.0.0
  description: Sync messages, to-dos, and card tables from Basecamp 3/4

spec:
  type: rest
  baseURL: https://3.basecampapi.com

  auth:
    type: bearer
    secretRef: BASECAMP_ACCESS_TOKEN

  operations:
    - name: list_recordings
      method: GET
      path: /my/recordings.json
      pagination:
        type: page
        pageParam: page
      response:
        itemsPath: "$"

  mapping:
    id: $.id
    title: $.title
    content: $.content
    eventDate: $.updated_at
    authorName: $.creator.name
    url: $.app_url

  sync:
    mode: incremental
    checkpoint: updated_at

  policies:
    timeout: 15s
    maxRetries: 3
    rateLimitPerMin: 50
