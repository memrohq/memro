apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: outline
  version: "1"
  displayName: Outline
  category: knowledge
  description: Every document in your Outline workspace, in Markdown.
  docsURL: https://www.getoutline.com/developers#section/Authentication
spec:
  type: rest
  baseURL: https://{{config.host}}/api
  fields:
    - {name: host, label: Outline host, placeholder: acme.getoutline.com, pattern: "[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+(:[0-9]{2,5})?", help: "Your Outline address without https://, e.g. acme.getoutline.com or a self-hosted domain."}
    - {name: token, label: API key, secret: true, help: "Settings → API Keys."}
  auth: {type: bearer, secretRef: token}
  verify: {method: POST, path: /auth.info, body: '{}', accountId: data.team.id, accountName: data.team.name}
  operations:
    - name: documents
      method: POST
      path: /documents.list
      body: '{"limit":100,"offset":{{offset}},"sort":"updatedAt","direction":"DESC"}'
      pagination: {type: offset, offsetParam: "-", limit: 100}
      response: {itemsPath: data}
  mapping:
    id: id
    title: "{{title}}"
    content: |
      {{title}}

      {{text}}
    eventDate: updatedAt
    authorName: updatedBy.name
  sync: {mode: incremental, checkpoint: updatedAt, newestFirst: true}
  policies: {timeout: 30s, maxRetries: 3}
