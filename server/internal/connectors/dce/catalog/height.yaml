apiVersion: memro.dev/v1
kind: Connector

metadata:
  name: height
  version: 1.0.0
  description: Sync tasks, subtasks, and lists from Height

spec:
  type: rest
  baseURL: https://api.height.app

  auth:
    type: apiKey
    header: Authorization
    prefix: "api-key "
    secretRef: HEIGHT_API_KEY

  operations:
    - name: list_tasks
      method: GET
      path: /tasks
      pagination:
        type: cursor
        cursorParam: after
        cursorPath: cursor
      response:
        itemsPath: list

  mapping:
    id: $.id
    title: $.name
    content: $.description
    eventDate: $.updatedAt
    url: $.url

  sync:
    mode: incremental
    checkpoint: updatedAt

  policies:
    timeout: 15s
    maxRetries: 3
    rateLimitPerMin: 60
