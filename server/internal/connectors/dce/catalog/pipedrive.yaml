apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: pipedrive
  version: "1"
  displayName: Pipedrive
  category: communication
  description: Deals with their value, stage, status, organization and contact.
  docsURL: https://pipedrive.readme.io/docs/how-to-find-the-api-token
spec:
  type: rest
  baseURL: https://api.pipedrive.com/v1
  fields:
    - {name: token, label: API token, secret: true, help: "Personal preferences → API."}
  auth: {type: apiKey, secretRef: token, header: x-api-token}
  verify: {path: /users/me, accountId: data.company_id, accountName: data.company_name}
  operations:
    - name: deals
      method: GET
      path: /deals
      queryParams: {sort: "update_time DESC", status: all_not_deleted}
      pagination: {type: offset, offsetParam: start, limitParam: limit, limit: 100}
      response: {itemsPath: data}
  mapping:
    id: id
    title: "{{title}}"
    content: |
      Pipedrive deal: {{title}}
      Value: {{value}} {{currency}}
      Status: {{status}}
      Stage: {{stage_id}}
      Organization: {{org_name}}
      Contact: {{person_name}}
      Owner: {{owner_name}}
      Expected close: {{expected_close_date}}
    eventDate: update_time
    authorName: owner_name
  sync: {mode: incremental, checkpoint: update_time, newestFirst: true}
  policies: {timeout: 30s, maxRetries: 3}
