apiVersion: memro.dev/v1
kind: Connector

metadata:
  name: railway
  version: 1.0.0
  description: Sync deployments, environments, and services from Railway

spec:
  type: rest
  baseURL: https://backboard.railway.com

  auth:
    type: bearer
    secretRef: RAILWAY_API_TOKEN

  operations:
    - name: list_projects
      method: POST
      path: /graphql/v2
      headers:
        Content-Type: application/json
      body: '{"query": "query { projects { edges { node { id name description createdAt updatedAt } } } }"}'
      pagination:
        type: none
      response:
        itemsPath: data.projects.edges

  mapping:
    id: $.node.id
    title: $.node.name
    content: $.node.description
    eventDate: $.node.updatedAt

  sync:
    mode: incremental
    checkpoint: node.updatedAt

  policies:
    timeout: 15s
    maxRetries: 3
    rateLimitPerMin: 100
