apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: front
  version: "1"
  displayName: Front
  category: communication
  description: Conversations with their status, assignee, tags and latest message.
  docsURL: https://dev.frontapp.com/docs/create-and-revoke-api-tokens
spec:
  type: rest
  baseURL: https://api2.frontapp.com
  fields:
    - {name: token, label: API token, secret: true, help: "Settings → Developers → API tokens, with the Shared resources read scope."}
  auth: {type: bearer, secretRef: token}
  verify: {path: /me, accountId: id, accountName: name}
  operations:
    - name: conversations
      method: GET
      path: /conversations
      queryParams: {limit: "100"}
      pagination: {type: nextURL, cursorPath: _pagination.next}
      response: {itemsPath: _results}
  mapping:
    id: id
    title: "{{subject}}"
    content: |
      Front conversation: {{subject}}
      Status: {{status}}
      Assignee: {{assignee.email}}
      Contact: {{recipient.handle}}
      Tags: {{tags[].name}}
      Latest message: {{last_message.blurb}}
    memoryType: episodic
    eventDate: last_message.created_at
  sync: {mode: full}
  policies: {timeout: 30s, maxRetries: 3}
