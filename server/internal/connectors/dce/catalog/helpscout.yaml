apiVersion: memro.dev/v1
kind: Connector

metadata:
  name: helpscout
  version: 1.0.0
  description: Sync conversations, mailboxes, and customer replies from Help Scout

spec:
  type: rest
  baseURL: https://api.helpscout.net/v2

  auth:
    type: bearer
    secretRef: HELPSCOUT_ACCESS_TOKEN

  operations:
    - name: list_conversations
      method: GET
      path: /conversations
      pagination:
        type: page
        pageParam: page
      response:
        itemsPath: _embedded.conversations

  mapping:
    id: $.id
    title: $.subject
    content: $.preview
    eventDate: $.userUpdatedAt

  sync:
    mode: incremental
    checkpoint: userUpdatedAt

  policies:
    timeout: 15s
    maxRetries: 3
    rateLimitPerMin: 120
