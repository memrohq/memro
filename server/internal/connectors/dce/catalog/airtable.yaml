apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: airtable
  version: "1"
  displayName: Airtable
  category: knowledge
  description: Records from the tables of one Airtable base, every field included.
  docsURL: https://airtable.com/developers/web/guides/personal-access-tokens
spec:
  type: rest
  baseURL: https://api.airtable.com/v0
  fields:
    - {name: token, label: Personal access token, secret: true, help: "airtable.com/create/tokens, with data.records:read and schema.bases:read on this base."}
    - {name: baseId, label: Base ID, placeholder: appXXXXXXXXXXXXXX, pattern: "app[A-Za-z0-9]{14}", help: "Starts with app; it is in the base's URL."}
  auth: {type: bearer, secretRef: token}
  verify: {path: /meta/whoami, accountId: id, accountName: email}
  sources:
    operation:
      name: tables
      method: GET
      path: /meta/bases/{{config.baseId}}/tables
      response: {itemsPath: tables}
    id: id
    name: name
  operations:
    - name: records
      method: GET
      path: /{{config.baseId}}/{{source.id}}
      queryParams: {pageSize: "100"}
      pagination: {type: cursor, cursorParam: offset, cursorPath: offset}
      response: {itemsPath: records}
  mapping:
    id: id
    title: "{{fields.Name}}"
    content: |
      {{fields|kv}}
    eventDate: createdTime
  sync: {mode: full}
  policies: {timeout: 30s, maxRetries: 3}
