apiVersion: memro.dev/v1
kind: Connector

metadata:
  name: asana
  version: 1.0.0
  description: Sync workspaces, projects, and tasks from Asana

spec:
  type: rest
  baseURL: https://app.asana.com/api/1.0

  auth:
    type: bearer
    secretRef: ASANA_ACCESS_TOKEN

  operations:
    - name: list_workspaces
      method: GET
      path: /workspaces
      queryParams:
        opt_fields: "gid,name,email_domains"
      pagination:
        type: none
      response:
        itemsPath: data

  mapping:
    id: $.gid
    title: $.name
    content: $.name

  sync:
    mode: full

  policies:
    timeout: 15s
    maxRetries: 3
    rateLimitPerMin: 150
