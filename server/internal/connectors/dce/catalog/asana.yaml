apiVersion: memro.dev/v1
kind: Connector

metadata:
  name: asana
  version: 1.0.0
  description: Sync tasks, notes, and projects from Asana

spec:
  type: rest
  baseURL: https://app.asana.com/api/1.0

  auth:
    type: bearer
    secretRef: ASANA_ACCESS_TOKEN

  operations:
    - name: list_tasks
      method: GET
      path: /tasks
      queryParams:
        opt_fields: "gid,name,notes,created_at,modified_at,permalink_url,assignee.name"
      pagination:
        type: offset
        offsetParam: offset
        limitParam: limit
        limit: 50
      response:
        itemsPath: data

  mapping:
    id: $.gid
    title: $.name
    content: $.notes
    eventDate: $.modified_at
    authorName: $.assignee.name
    url: $.permalink_url

  sync:
    mode: incremental
    checkpoint: modified_at

  policies:
    timeout: 15s
    maxRetries: 3
    rateLimitPerMin: 150
