apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: grafana
  version: "1"
  displayName: Grafana
  category: engineering
  description: Dashboards in your Grafana instance, with folders and tags.
  docsURL: https://grafana.com/docs/grafana/latest/administration/service-accounts/
spec:
  type: rest
  baseURL: https://{{config.host}}/api
  fields:
    - {name: host, label: Grafana host, placeholder: acme.grafana.net, pattern: "[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+(:[0-9]{2,5})?", help: "Your Grafana address without https://, e.g. acme.grafana.net."}
    - {name: token, label: Service account token, secret: true, help: "Administration → Service accounts, with the Viewer role."}
  auth: {type: bearer, secretRef: token}
  verify: {path: /org, accountId: id, accountName: name}
  operations:
    - name: dashboards
      method: GET
      path: /search
      queryParams: {type: dash-db}
      pagination: {type: page, pageParam: page, limitParam: limit, limit: 1000}
      response: {itemsPath: $}
  mapping:
    id: uid
    title: "Dashboard: {{title}}"
    content: |
      Grafana dashboard: {{title}}
      Folder: {{folderTitle}}
      Tags: {{tags[]}}
      Path: {{url}}
  sync: {mode: full}
  policies: {timeout: 30s, maxRetries: 3}
