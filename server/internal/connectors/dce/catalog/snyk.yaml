apiVersion: memro.dev/v1
kind: Connector

metadata:
  name: snyk
  version: 1.0.0
  description: Sync vulnerabilities, licenses, and security issues from Snyk

spec:
  type: rest
  baseURL: https://api.snyk.io/v1

  auth:
    type: apiKey
    header: Authorization
    prefix: "token "
    secretRef: SNYK_API_TOKEN

  operations:
    - name: list_orgs
      method: GET
      path: /orgs
      pagination:
        type: none
      response:
        itemsPath: orgs

  mapping:
    id: $.id
    title: $.name
    content: $.slug
    url: $.url

  sync:
    mode: full

  policies:
    timeout: 15s
    maxRetries: 3
    rateLimitPerMin: 60
