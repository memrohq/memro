apiVersion: memro.dev/v1
kind: Connector
metadata:
  name: trello
  version: "1"
  displayName: Trello
  category: work
  description: Cards from the Trello boards you choose, with lists, labels and due dates.
  docsURL: https://developer.atlassian.com/cloud/trello/guides/rest-api/api-introduction/
spec:
  type: rest
  baseURL: https://api.trello.com/1
  fields:
    - {name: apiKey, label: API key, secret: true, help: "trello.com/power-ups/admin → your Power-Up → API key."}
    - {name: token, label: Token, secret: true, help: "Generated from the Token link next to your API key (read access)."}
  auth: {type: query, secretRef: token, header: token}
  verify: {path: /members/me, queryParams: {key: "{{config.apiKey}}", fields: "id,fullName"}, accountId: id, accountName: fullName}
  sources:
    operation:
      name: boards
      method: GET
      path: /members/me/boards
      queryParams: {key: "{{config.apiKey}}", filter: open, fields: "id,name"}
      response: {itemsPath: $}
    id: id
    name: name
  operations:
    - name: cards
      method: GET
      path: /boards/{{source.id}}/cards/all
      queryParams:
        key: "{{config.apiKey}}"
        fields: id,name,desc,dateLastActivity,due,closed,shortUrl,labels
      response: {itemsPath: $}
  mapping:
    id: id
    title: "{{name}}"
    content: |
      Trello card: {{name}}
      Labels: {{labels[].name}}
      Due: {{due}}
      Archived: {{closed}}

      {{desc}}
    eventDate: dateLastActivity
    url: shortUrl
  sync: {mode: full}
  policies: {timeout: 30s, maxRetries: 3}
