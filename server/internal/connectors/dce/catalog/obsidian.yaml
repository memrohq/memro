apiVersion: memro.dev/v1
kind: Connector

metadata:
  name: obsidian
  version: 1.0.0
  description: Sync markdown notes and linked references from Obsidian Publish

spec:
  type: rest
  baseURL: https://publish.obsidian.md

  auth:
    type: bearer
    secretRef: OBSIDIAN_PUBLISH_TOKEN

  operations:
    - name: list_notes
      method: GET
      path: /api/notes
      pagination:
        type: none
      response:
        itemsPath: "$"

  mapping:
    id: $.id
    title: $.title
    content: $.content
    eventDate: $.updated_at
    url: $.url

  sync:
    mode: incremental
    checkpoint: updated_at

  policies:
    timeout: 15s
    maxRetries: 3
    rateLimitPerMin: 60
