services:
  - type: web
    name: memro-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: memro-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false   # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # set to your frontend domain
      - key: DB_MAX_CONNECTIONS
        value: "20"
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY_HEADERS
        value: "true"

databases:
  - name: memro-db
    databaseName: memro
    user: memro
    plan: free
