[build]
builder = "dockerfile"
dockerfilePath = "memro-core/backend/Dockerfile"

[deploy]
startCommand = "memro-backend"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "backend"
source = "."

[[services]]
name = "postgres"
image = "postgres:15-alpine"

[services.variables]
POSTGRES_DB = "memro"

[[services]]
name = "qdrant"
image = "qdrant/qdrant:latest"
